<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class XI Study Tracker</title>
<style>
:root{
  --bg:#f4f2ee; --surface:#ffffff; --surface2:#faf8f4; --ink:#1d2433; --muted:#6b7385; --line:#e6e2d9;
  --accent:#4f46e5; --accent-soft:#eceafd; --shadow:0 1px 2px rgba(29,36,51,.05),0 8px 24px rgba(29,36,51,.06);
  --study:#3b82f6; --revise:#f59e0b; --test:#10b981;
  --radius:16px;
}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1b2030; --surface2:#20263a; --ink:#e8ebf4; --muted:#98a1b8; --line:#2c3350;
  --accent-soft:#2a2c5c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
body[data-subject="physics"]{--accent:#2563eb;--accent2:#06b6d4;--accent-soft:#e3edff}
body[data-subject="chemistry"]{--accent:#059669;--accent2:#84cc16;--accent-soft:#dcf6ea}
body[data-subject="maths"]{--accent:#7c3aed;--accent2:#ec4899;--accent-soft:#efe6ff}
:root[data-theme="dark"] body[data-subject="physics"]{--accent-soft:#1c2c55}
:root[data-theme="dark"] body[data-subject="chemistry"]{--accent-soft:#143a2d}
:root[data-theme="dark"] body[data-subject="maths"]{--accent-soft:#2e2158}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

/* hero */
.hero{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;padding:34px 0 90px;transition:background .4s}
.hero .wrap{padding-bottom:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero h1{margin:0;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;font-weight:800}
.hero p{margin:6px 0 0;opacity:.9}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.tbtn:hover{background:rgba(255,255,255,.3)}

/* summary */
.summary{margin-top:-62px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:24px;display:grid;grid-template-columns:auto 1fr;gap:28px;border:1px solid var(--line)}
.overall{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:30px;line-height:1}
.ring .num small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.ostats h2{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.pill{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill b{font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.scard{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.scard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.scard.active{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.scard .top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.scard .pct{font-size:22px;font-weight:800;color:var(--c)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));transition:width .4s}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.mini span b{display:block;color:var(--ink);font-size:13px}
.mini .bar{height:4px;margin-top:3px}
.scard[data-s="physics"]{--c:#2563eb}.scard[data-s="chemistry"]{--c:#059669}.scard[data-s="maths"]{--c:#7c3aed}
.mini .bar i.s{background:var(--study)}.mini .bar i.r{background:var(--revise)}.mini .bar i.t{background:var(--test)}

/* tabs */
.tabs{display:flex;gap:8px;margin:28px 0 14px;position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(var(--bg) 75%,transparent)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;transition:all .2s}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 18px -6px var(--accent)}
.tab em{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(127,127,127,.15)}
.tab.active em{background:rgba(255,255,255,.25)}

/* panel header */
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.phead input[type=search]{flex:1;min-width:200px;max-width:380px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.phead input:focus{outline:2px solid var(--accent);outline-offset:1px}
.sbtn{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;font-weight:600}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}

/* chapters */
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chead{width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;background:none;border:0;text-align:left}
.chead:hover{background:var(--surface2)}
.cnum{flex:none;min-width:70px;text-align:center;padding:6px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.5px;letter-spacing:.02em}
.ctitle{flex:1;min-width:0}
.ctitle b{display:block;font-size:16.5px}
.ctitle small{color:var(--muted)}
.cprog{display:flex;align-items:center;gap:10px;width:210px;flex:none}
.cprog .bar{flex:1;margin:0}
.cprog span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.chev{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);transition:transform .25s}
.chapter.open .chev{transform:rotate(180deg)}
.cbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.chapter.open .cbody{grid-template-rows:1fr}
.cbody>div{overflow:hidden}
.chapter.complete{border-color:var(--test)}
.chapter.complete .cnum{background:var(--test);color:#fff}

table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;padding:9px 8px;background:var(--surface2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
thead th.l{text-align:left}
thead th label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.code{width:64px;color:var(--accent);font-weight:700;font-size:13px;padding-left:18px;font-variant-numeric:tabular-nums}
td.topic{width:24%;font-weight:600;font-size:14px}
td.topic.rep{color:transparent;user-select:none;font-size:0}
td.sub{min-width:200px}
td.sub .d{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
td.chk{width:70px;text-align:center}
td.img{width:150px;text-align:center;padding-right:18px}
tr.grp td{border-top:1px solid var(--line)}
tr.done td.sub .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(127,127,127,.5)}
tr.done{background:linear-gradient(90deg,rgba(16,185,129,.07),transparent)}
tr.hide{display:none}

/* custom checkbox */
.cb{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-content:center;transition:all .15s;vertical-align:middle;margin:0}
.cb:hover{border-color:var(--k)}
.cb::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .15s}
.cb:checked{background:var(--k);border-color:var(--k)}
.cb:checked::after{transform:rotate(-45deg) scale(1)}
.cb:indeterminate{background:var(--k);border-color:var(--k)}
.cb:indeterminate::after{width:10px;height:0;border-width:0 0 2.5px 0;transform:none;margin-top:0}
.cb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cb.s{--k:var(--study)}.cb.r{--k:var(--revise)}.cb.t{--k:var(--test)}
.hs{color:var(--study)}.hr{color:var(--revise)}.ht{color:var(--test)}

/* image upload */
.up{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.up:hover,.up.drag{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.up input{display:none}
.thumb{display:inline-flex;align-items:center;gap:6px}
.thumb img{width:56px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;transition:transform .15s;background:var(--surface2)}
.thumb img:hover{transform:scale(1.08)}
.x{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);line-height:1;font-size:14px}
.x:hover{background:#ef4444;color:#fff;border-color:#ef4444}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,12,20,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;flex-direction:column;gap:12px}
.lb.show{display:flex}
.lb img{max-width:100%;max-height:calc(100vh - 100px);border-radius:12px;background:#fff}
.lb p{color:#fff;margin:0;font-weight:600;text-align:center}
.lb .close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.15);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .3s;z-index:120}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:40px}

@media(max-width:900px){
  .summary{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .cprog{width:120px}.cprog .bar{display:none}
  td.topic{width:auto}
}
@media(max-width:700px){
  .tab{font-size:13px;padding:10px 6px;flex-direction:column;gap:2px}
  .tab em{display:none}
  .wrap{padding:0 12px 60px}
  .ostats{display:none}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{display:grid;grid-template-columns:repeat(3,1fr) ;gap:4px 0;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{border:0;padding:2px}
  td.code,td.topic,td.sub,td.img{grid-column:1/-1;width:auto;padding-left:2px}
  td.topic.rep{display:none}
  td.chk::before{content:attr(data-l);display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  td.img{text-align:left;margin-top:6px}
}
@media print{.hero .tools,.tabs,.phead{display:none}}
</style>
</head>
<body data-subject="physics">

<header class="hero">
  <div class="wrap">
    <div>
      <h1>📚 Class XI Study Tracker</h1>
      <p>Physics · Chemistry · Mathematics — tick off Study, Revise &amp; Test as you go.</p>
    </div>
    <div class="tools">
      <button class="tbtn" id="themeBtn">🌙 Dark mode</button>
      <button class="tbtn" id="exportBtn">⬇ Export progress</button>
      <label class="tbtn" style="cursor:pointer">⬆ Import<input type="file" id="importFile" accept="application/json" hidden></label>
      <button class="tbtn" id="resetBtn">↺ Reset</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="summary" aria-label="Progress summary">
    <div class="overall">
      <div class="ring">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="56" fill="none" stroke="var(--line)" stroke-width="12"/>
          <circle id="ringArc" cx="66" cy="66" r="56" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86" style="transition:stroke-dashoffset .6s"/>
        </svg>
        <div class="num"><div><span id="ringPct">0%</span><small>Overall</small></div></div>
      </div>
      <div class="ostats">
        <h2>All subjects</h2>
        <div class="pill"><span class="dot" style="background:var(--study)"></span>Studied <b id="oS"></b></div>
        <div class="pill"><span class="dot" style="background:var(--revise)"></span>Revised <b id="oR"></b></div>
        <div class="pill"><span class="dot" style="background:var(--test)"></span>Tested <b id="oT"></b></div>
        <div class="pill"><span class="dot" style="background:var(--muted)"></span>Infographics <b id="oI"></b></div>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="panel"></div>
</main>

<div class="lb" id="lb"><button class="close" aria-label="Close">×</button><img alt=""><p></p></div>
<div class="toast" id="toast"></div>

/* ---------- state ---------- */
let state = {checks:{}, open:{}, tab:'physics', theme:null};   // checks[id] = "srt" subset string
const imgs = {};                                               // id -> dataURL (IndexedDB)
let lsOK = true;
try { Object.assign(state, JSON.parse(localStorage.getItem(LS_KEY)||'{}')); } catch(e){ lsOK=false; }
const save = () => { try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ lsOK=false; } };

/* IndexedDB for infographics (falls back to memory) */
let db=null;
const idb = {
  open(){ return new Promise(res=>{ try{
      const rq=indexedDB.open('xi-tracker-images',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('img');
      rq.onsuccess=()=>{db=rq.result;res()}; rq.onerror=()=>res();
    }catch(e){res()} }); },
  all(){ return new Promise(res=>{ if(!db) return res(); try{
      const tx=db.transaction('img'),st=tx.objectStore('img'),rq=st.openCursor();
      rq.onsuccess=()=>{const c=rq.result; if(c){imgs[c.key]=c.value;c.continue()} else res()};
      rq.onerror=()=>res();
    }catch(e){res()} }); },
  put(k,v){ try{ db&&db.transaction('img','readwrite').objectStore('img').put(v,k) }catch(e){} },
  del(k){ try{ db&&db.transaction('img','readwrite').objectStore('img').delete(k) }catch(e){} },
  clear(){ try{ db&&db.transaction('img','readwrite').objectStore('img').clear() }catch(e){} }
};

/* ---------- ids & helpers ---------- */
DATA.forEach(s=>s.chapters.forEach((c,ci)=>c.items.forEach((it,ii)=>{ it.id=`${s.id}-${ci}-${ii}`; })));
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has=(id,k)=>(state.checks[id]||'').includes(k);
const pct=(a,b)=>b?Math.round(a/b*100):0;

function stats(items){
  const n=items.length, o={n,s:0,r:0,t:0,img:0,done:0};
  items.forEach(it=>{ const v=state.checks[it.id]||''; if(v.includes('s'))o.s++; if(v.includes('r'))o.r++; if(v.includes('t'))o.t++;
    if(imgs[it.id])o.img++; if(v.length===3)o.done++; });
  o.pct=pct(o.s+o.r+o.t, n*3); return o;
}
const allItems=s=>s.chapters.flatMap(c=>c.items);

/* ---------- summary ---------- */
function renderSummary(){
  const all=DATA.flatMap(allItems), o=stats(all);
  $('#ringPct').textContent=o.pct+'%';
  $('#ringArc').style.strokeDashoffset = 351.86*(1-o.pct/100);
  $('#oS').textContent=`${o.s}/${o.n}`; $('#oR').textContent=`${o.r}/${o.n}`; $('#oT').textContent=`${o.t}/${o.n}`; $('#oI').textContent=`${o.img}/${o.n}`;
  $('#cards').innerHTML=DATA.map(s=>{
    const st=stats(allItems(s));
    const m=(l,k,c)=>`<span>${l}<b>${st[k]}/${st.n}</b><div class="bar"><i class="${c}" style="width:${pct(st[k],st.n)}%"></i></div></span>`;
    return `<button class="scard ${state.tab===s.id?'active':''}" data-s="${s.id}">
      <div class="top"><span>${s.icon} ${s.name}</span><span class="pct">${st.pct}%</span></div>
      <div class="bar"><i style="width:${st.pct}%"></i></div>
      <div class="mini">${m('Study','s','s')}${m('Revise','r','r')}${m('Test','t','t')}</div>
    </button>`}).join('');
  $$('.scard').forEach(b=>b.onclick=()=>switchTab(b.dataset.s,true));
  $$('.tab').forEach(t=>{ const s=DATA.find(x=>x.id===t.dataset.s); t.querySelector('em').textContent=stats(allItems(s)).pct+'%'; });
}

/* ---------- tabs ---------- */
function renderTabs(){
  $('#tabs').innerHTML=DATA.map(s=>`<button class="tab ${state.tab===s.id?'active':''}" role="tab" data-s="${s.id}">${s.icon} ${s.name} <em>0%</em></button>`).join('');
  $$('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.s));
}
function switchTab(id,scroll){
  state.tab=id; save(); document.body.dataset.subject=id;
  $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.s===id));
  renderPanel(); renderSummary();
  if(scroll) $('#tabs').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- panel ---------- */
function renderPanel(){
  const s=DATA.find(x=>x.id===state.tab);
  let h=`<div class="phead"><input type="search" id="q" placeholder="Search topics in ${s.name}…" aria-label="Search">
    <div style="display:flex;gap:8px"><button class="sbtn" id="expAll">Expand all</button><button class="sbtn" id="colAll">Collapse all</button></div></div>`;
  s.chapters.forEach((c,ci)=>{
    const key=`${s.id}-${ci}`; const open=!!state.open[key];
    let lastTopic=null;
    const rows=c.items.map(it=>{
      const grp = it.topic!==lastTopic; lastTopic=it.topic;
      const v=state.checks[it.id]||'';
      return `<tr data-id="${it.id}" class="${grp?'grp':''} ${v.length===3?'done':''}" data-search="${esc((it.code+' '+it.topic+' '+it.sub+' '+it.desc).toLowerCase())}">
        <td class="code">${esc(it.code)}</td>
        <td class="topic ${grp?'':'rep'}">${esc(it.topic)}</td>
        <td class="sub"><span class="t">${esc(it.sub)}</span>${it.desc?`<span class="d">${esc(it.desc)}</span>`:''}</td>
        ${TASKS.map(([k,l])=>`<td class="chk" data-l="${l}"><input type="checkbox" class="cb ${k}" data-k="${k}" aria-label="${l}: ${esc(it.sub)}" ${v.includes(k)?'checked':''}></td>`).join('')}
        <td class="img">${imgCell(it.id)}</td></tr>`;
    }).join('');
    h+=`<section class="chapter ${open?'open':''}" data-key="${key}" data-ci="${ci}">
      <button class="chead" aria-expanded="${open}">
        <span class="cnum">${esc(c.label)}</span>
        <span class="ctitle"><b>${esc(c.title)}</b><small class="cmeta"></small></span>
        <span class="cprog"><span class="bar"><i></i></span><span class="cpct">0%</span></span>
        <span class="chev">▾</span>
      </button>
      <div class="cbody"><div><table>
        <thead><tr><th class="l" style="padding-left:18px">Code</th><th class="l">Topic</th><th class="l">Subtopic / Key concept</th>
          ${TASKS.map(([k,l,cl])=>`<th class="${cl}"><label>${l}<input type="checkbox" class="cb ${k} all" data-k="${k}" aria-label="Select all ${l}"></label></th>`).join('')}
          <th>Infographic</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>
    </section>`;
  });
  $('#panel').innerHTML=h;
  s.chapters.forEach((c,ci)=>updateChapter(s,ci));
  bindPanel(s);
}
function imgCell(id){
  return imgs[id]
   ? `<span class="thumb"><img src="${imgs[id]}" alt="Infographic" data-view="${id}"><button class="x" data-del="${id}" title="Remove image" aria-label="Remove infographic">×</button></span>`
   : `<label class="up" title="Upload an infographic image">📷 Upload<input type="file" accept="image/*" data-up="${id}"></label>`;
}
function updateChapter(s,ci){
  const sec=$(`.chapter[data-ci="${ci}"]`); if(!sec) return;
  const c=s.chapters[ci], st=stats(c.items);
  sec.querySelector('.cpct').textContent=st.pct+'%';
  sec.querySelector('.bar i').style.width=st.pct+'%';
  sec.querySelector('.cmeta').textContent=`${c.meta?c.meta+' · ':''}${st.n} subtopics · ${st.done} fully done`;
  sec.classList.toggle('complete',st.done===st.n&&st.n>0);
  ['s','r','t'].forEach(k=>{
    const h=sec.querySelector(`thead .cb[data-k="${k}"]`); const n=st[k];
    h.checked=n===st.n&&n>0; h.indeterminate=n>0&&n<st.n;
  });
}

function bindPanel(s){
  $('#expAll').onclick=()=>{ s.chapters.forEach((_,i)=>state.open[`${s.id}-${i}`]=true); save(); $$('.chapter').forEach(e=>setOpen(e,true)); };
  $('#colAll').onclick=()=>{ s.chapters.forEach((_,i)=>delete state.open[`${s.id}-${i}`]); save(); $$('.chapter').forEach(e=>setOpen(e,false)); };
  $('#q').oninput=e=>search(e.target.value.trim().toLowerCase());
  $$('.chead').forEach(b=>b.onclick=()=>{ const e=b.parentElement; const o=!e.classList.contains('open'); setOpen(e,o); state.open[e.dataset.key]=o||undefined; save(); });
  $$('tbody .cb').forEach(cb=>cb.onchange=()=>{
    const tr=cb.closest('tr'), id=tr.dataset.id; let v=state.checks[id]||'';
    v = cb.checked ? (v.includes(cb.dataset.k)?v:v+cb.dataset.k) : v.replace(cb.dataset.k,'');
    if(v) state.checks[id]=v; else delete state.checks[id];
    tr.classList.toggle('done',v.length===3); save();
    updateChapter(s,+tr.closest('.chapter').dataset.ci); renderSummary();
  });
  $$('thead .cb').forEach(cb=>cb.onchange=()=>{
    const sec=cb.closest('.chapter'), k=cb.dataset.k, on=cb.checked;
    $$('tbody tr',sec).forEach(tr=>{
      const id=tr.dataset.id; let v=(state.checks[id]||'').replace(k,''); if(on) v+=k;
      if(v) state.checks[id]=v; else delete state.checks[id];
      tr.classList.toggle('done',v.length===3);
      tr.querySelector(`.cb[data-k="${k}"]`).checked=on;
    });
    save(); updateChapter(s,+sec.dataset.ci); renderSummary();
  });
  $$('[data-up]').forEach(bindUpload);
  $$('[data-del]').forEach(b=>b.onclick=()=>removeImg(b.dataset.del,s));
  $$('[data-view]').forEach(i=>i.onclick=()=>openLB(i.dataset.view,s));
}
function setOpen(e,o){ e.classList.toggle('open',o); e.querySelector('.chead').setAttribute('aria-expanded',o); }

function search(q){
  $$('.chapter').forEach(sec=>{
    let any=false;
    $$('tbody tr',sec).forEach(tr=>{ const m=!q||tr.dataset.search.includes(q); tr.classList.toggle('hide',!m); any=any||m; });
    sec.style.display=any?'':'none';
    if(q&&any) setOpen(sec,true); else if(!q) setOpen(sec,!!state.open[sec.dataset.key]);
  });
}

/* ---------- images ---------- */
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const im=new Image();
      im.onerror=rej;
      im.onload=()=>{
        const M=1800, sc=Math.min(1,M/Math.max(im.width,im.height));
        if(sc===1 && file.size<600*1024) return res(fr.result);
        const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',.88));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function setImage(id,file,s){
  if(!file||!file.type.startsWith('image/')) return toast('Please choose an image file');
  try{ imgs[id]=await shrink(file); idb.put(id,imgs[id]); }catch(e){ return toast('Could not read that image'); }
  refreshImgCell(id); renderSummary();
}
function refreshImgCell(id){
  const tr=$(`tr[data-id="${id}"]`); if(!tr) return;
  const td=tr.querySelector('td.img'); td.innerHTML=imgCell(id);
  const s=DATA.find(x=>x.id===state.tab);
  td.querySelectorAll('[data-up]').forEach(bindUpload);
  td.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeImg(b.dataset.del,s));
  td.querySelectorAll('[data-view]').forEach(i=>i.onclick=()=>openLB(i.dataset.view,s));
}
function bindUpload(inp){
  inp.onchange=()=>{ setImage(inp.dataset.up,inp.files[0]); };
  const lab=inp.parentElement;
  ['dragover','dragenter'].forEach(ev=>lab.addEventListener(ev,e=>{e.preventDefault();lab.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev=>lab.addEventListener(ev,e=>{e.preventDefault();lab.classList.remove('drag')}));
  lab.addEventListener('drop',e=>setImage(inp.dataset.up,e.dataTransfer.files[0]));
}
function removeImg(id){ delete imgs[id]; idb.del(id); refreshImgCell(id); renderSummary(); }

/* lightbox */
function findItem(id){ for(const s of DATA) for(const c of s.chapters) for(const it of c.items) if(it.id===id) return it; }
function openLB(id){ const it=findItem(id), lb=$('#lb'); lb.querySelector('img').src=imgs[id]; lb.querySelector('p').textContent=`${it.code} ${it.sub}`; lb.classList.add('show'); }
$('#lb').onclick=e=>{ if(e.target.tagName!=='IMG') $('#lb').classList.remove('show'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#lb').classList.remove('show'); });

/* ---------- toolbar ---------- */
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2400); }
function applyTheme(){
  const dark = state.theme ? state.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark?'dark':'light';
  $('#themeBtn').textContent = dark?'☀️ Light mode':'🌙 Dark mode';
}
$('#themeBtn').onclick=()=>{ state.theme = document.documentElement.dataset.theme==='dark'?'light':'dark'; save(); applyTheme(); };
$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({checks:state.checks,images:imgs},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='study-tracker-progress.json'; a.click(); toast('Progress exported (includes infographics)');
};
$('#importFile').onchange=async e=>{
  try{
    const d=JSON.parse(await e.target.files[0].text());
    state.checks=d.checks||{}; idb.clear(); Object.keys(imgs).forEach(k=>delete imgs[k]);
    Object.entries(d.images||{}).forEach(([k,v])=>{imgs[k]=v; idb.put(k,v)});
    save(); renderPanel(); renderSummary(); toast('Progress imported');
  }catch(err){ toast('That file is not a valid progress export'); }
  e.target.value='';
};
$('#resetBtn').onclick=()=>{
  if(!confirm('Reset ALL progress and remove all uploaded infographics?')) return;
  state.checks={}; state.open={}; idb.clear(); Object.keys(imgs).forEach(k=>delete imgs[k]); save(); renderPanel(); renderSummary(); toast('Progress reset');
};

/* ---------- init ---------- */
(async()=>{
  if(!DATA.some(s=>s.id===state.tab)) state.tab='physics';
  applyTheme(); document.body.dataset.subject=state.tab;
  await idb.open(); await idb.all();
  renderTabs(); renderPanel(); renderSummary();
  if(!lsOK) toast('Browser storage is unavailable — progress will not be saved after closing.');
})();
</script>
